services:
    # image app
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www

        networks:
            - laravel

    # nginx
    nginx-migrador:
        image: nginx:1.30.4
        container_name: nginx-migrador
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/:/etc/nginx/conf.d/
        networks:
            - laravel

    # postgres
    database:
        image: postgres:18.4
        container_name: database
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-postgres}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD-postgres}
            POSTGRES_SCHEMA: ${DB_SCHEMA:-public}
        volumes:
            - ./.docker/postgresql:/var/lib/postgresql
        ports:
            - "5432:5432"
        networks:
            - laravel

    #rede bridge
networks:
    laravel:
        driver: bridge